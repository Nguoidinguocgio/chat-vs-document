<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-02 · Đổi mật khẩu</title>
<style>
:root{--bg-subtle:#F8FAFC;--text:#0F172A;--muted:#475569;--border:#CBD5E1;--border-strong:#64748B;--primary:#1D4ED8;--primary-hover:#1E40AF;--primary-bg:#EFF6FF;--success:#15803D;--warning:#B45309;--warning-bg:#FFFBEB;--danger:#B91C1C;--danger-bg:#FEF2F2;--r-md:8px;--r-lg:12px;--e2:0 4px 12px rgba(15,23,42,.12);--e3:0 12px 32px rgba(15,23,42,.18);--font:Inter,"Segoe UI",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;font:14px/20px var(--font);color:var(--text);background:var(--bg-subtle)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}
.card{width:100%;max-width:440px;background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--e2);padding:32px 28px}
h1{margin:0 0 4px;font-size:24px;line-height:32px;font-weight:600}
.sub{margin:0 0 20px;color:var(--muted)}
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:var(--r-md);border:1px solid #93C5FD;background:var(--primary-bg);color:#1E3A8A;margin-bottom:20px}
form{display:grid;gap:16px}
.field{display:grid;gap:6px}
.field label{font-weight:600}
.pw{position:relative}
.input{height:40px;width:100%;padding:0 44px 0 12px;border:1px solid var(--border-strong);border-radius:var(--r-md);background:#fff}
.input[aria-invalid=true]{border-color:var(--danger)}
.pw button{position:absolute;right:4px;top:4px;width:32px;height:32px;border:0;background:transparent;border-radius:var(--r-md);cursor:pointer}
.pw button:hover{background:#E2E8F0}
.err{color:var(--danger);font-size:13px}
.rules{list-style:none;margin:0;padding:12px;display:grid;gap:4px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg-subtle);font-size:13px}
.rules li{display:flex;gap:8px;color:var(--muted)}
.rules li.ok{color:var(--success)}
.rules li b{width:16px;text-align:center}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border:1px solid var(--border-strong);border-radius:var(--r-md);background:#fff;font-weight:600;cursor:pointer;text-decoration:none;color:var(--text)}
.btn:hover:not(:disabled){background:var(--bg-subtle)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover:not(:disabled){background:var(--primary-hover)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.ok-box{text-align:center;display:grid;gap:12px;justify-items:center}
.ok-box .ic{width:56px;height:56px;border-radius:50%;background:#F0FDF4;color:var(--success);display:grid;place-items:center;font-size:28px}
</style>
</head>
<body>
<main class="card">
  <div id="view">
    <h1 id="ttl">Đổi mật khẩu</h1>
    <p class="sub" id="sub">Chọn mật khẩu mới cho tài khoản <b>lan@congty.vn</b>.</p>
    <div class="alert" id="req" role="status" hidden><span>ⓘ</span><span>Bạn đang dùng mật khẩu tạm do Admin cấp. Hãy đặt mật khẩu mới trước khi vào ứng dụng.</span></div>
    <form id="f" novalidate>
      <div class="field" id="cur-wrap">
        <label for="cur">Mật khẩu hiện tại</label>
        <div class="pw"><input class="input" id="cur" type="password" autocomplete="current-password" aria-describedby="e-cur"><button type="button" data-t="cur" aria-label="Hiện mật khẩu" aria-pressed="false">👁</button></div>
        <div class="err" id="e-cur" hidden></div>
      </div>
      <div class="field">
        <label for="n1">Mật khẩu mới</label>
        <div class="pw"><input class="input" id="n1" type="password" autocomplete="new-password" aria-describedby="rules e-n1"><button type="button" data-t="n1" aria-label="Hiện mật khẩu" aria-pressed="false">👁</button></div>
        <div class="err" id="e-n1" hidden></div>
        <ul class="rules" id="rules" aria-label="Yêu cầu mật khẩu">
          <li data-r="len"><b>○</b>Ít nhất 10 ký tự</li>
          <li data-r="alpha"><b>○</b>Có chữ cái</li>
          <li data-r="num"><b>○</b>Có chữ số</li>
        </ul>
      </div>
      <div class="field">
        <label for="n2">Nhập lại mật khẩu mới</label>
        <div class="pw"><input class="input" id="n2" type="password" autocomplete="new-password" aria-describedby="e-n2"><button type="button" data-t="n2" aria-label="Hiện mật khẩu" aria-pressed="false">👁</button></div>
        <div class="err" id="e-n2" hidden></div>
      </div>
      <div class="row">
        <a class="btn" id="cancel" href="SCR-03_workspace-chat.html">Hủy</a>
        <button class="btn primary" id="go" type="submit">Lưu mật khẩu</button>
      </div>
    </form>
  </div>
  <div class="ok-box" id="done" hidden role="status">
    <div class="ic" aria-hidden="true">✓</div>
    <h1>Đã đổi mật khẩu</h1>
    <p class="sub" style="margin:0">Đang chuyển tới workspace…</p>
    <a class="btn primary" href="SCR-03_workspace-chat.html">Vào workspace</a>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
const required=new URLSearchParams(location.search).get('mode')==='required';
if(required){$('#req').hidden=false;$('#cur-wrap').hidden=true;$('#cancel').hidden=true;$('#ttl').textContent='Đặt mật khẩu mới'}
const rules={len:v=>v.length>=10,alpha:v=>/[A-Za-zÀ-ỹ]/.test(v),num:v=>/\d/.test(v)};
function check(){const v=$('#n1').value;let all=true;document.querySelectorAll('#rules li').forEach(li=>{const ok=rules[li.dataset.r](v);all=all&&ok;li.classList.toggle('ok',ok);li.firstChild.textContent=ok?'✓':'○'});return all}
function err(id,m){const e=$('#e-'+id);e.hidden=!m;e.textContent=m||'';$('#'+id).setAttribute('aria-invalid',!!m)}
$('#n1').addEventListener('input',check);
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const i=$('#'+b.dataset.t),s=i.type==='password';i.type=s?'text':'password';b.setAttribute('aria-pressed',s);b.setAttribute('aria-label',s?'Ẩn mật khẩu':'Hiện mật khẩu')});
$('#f').onsubmit=e=>{
 e.preventDefault();
 const ok=check();let bad=null;
 if(!required){err('cur',$('#cur').value?'':'Vui lòng nhập mật khẩu hiện tại.');if(!$('#cur').value)bad=bad||'cur'}
 err('n1',ok?'':'Mật khẩu cần ít nhất 10 ký tự, gồm cả chữ và số.');if(!ok)bad=bad||'n1';
 const same=$('#n1').value===$('#n2').value&&$('#n2').value!=='';
 err('n2',same?'':'Hai mật khẩu chưa khớp.');if(!same)bad=bad||'n2';
 if(bad){$('#'+bad).focus();return}
 $('#view').hidden=true;$('#done').hidden=false;setTimeout(()=>location.href='SCR-03_workspace-chat.html',1800);
};
</script>
</body>
</html>
