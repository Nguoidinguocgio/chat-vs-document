name: ci
on:
  pull_request:
  push:
    branches: [dev/phase1, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mọi job phải xanh mới được merge: bật "Require status checks" cho web, api, contract trong cài đặt nhánh.
jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: Kiểu TS khớp contracts/openapi.yaml (T06)
        run: npm run gen:api && git diff --exit-code -- src/shared/api/schema.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      - name: npm audit (cảnh báo, chưa chặn)
        run: npm audit --omit=dev || echo "::warning::npm audit phát hiện lỗ hổng"

  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      # Spotless + Checkstyle + SpotBugs + JUnit (Testcontainers dùng Docker có sẵn trên runner)
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: surefire-reports, path: api/target/surefire-reports }

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra contracts/openapi.yaml (bổ sung ở T06)
        run: |
          if [ -f contracts/openapi.yaml ]; then
            npx --yes @redocly/cli@1.25.11 lint contracts/openapi.yaml
          else
            echo "Chưa có contracts/openapi.yaml (T06)"
          fi

  dependency-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: OWASP dependency-check (cảnh báo, chưa chặn)
        env: { NVD_API_KEY: '${{ secrets.NVD_API_KEY }}' }
        run: ./mvnw -B dependency-check:check -DnvdApiKey="$NVD_API_KEY" || echo "::warning::dependency-check báo lỗi"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: dependency-check-report, path: api/target/dependency-check-report.html }
